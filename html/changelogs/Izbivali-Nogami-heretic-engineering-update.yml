author: "Izbivali-Nogami"
delete-after: True
changes:
  - rscadd: "Добавлены три новых инженерных станционных проекта со своими машинами и заказами через карго: Bluespace Harvester, Bluespace Shield Field Generator и Power Transmission Laser."
  - rscadd: "Bluespace Harvester можно собрать ради добычи очков из блюспейса и обмена их на награды, но на высоких нагрузках он начинает устраивать опасные аномалии, выбросы и засоры."
  - rscadd: "Bluespace Shield Field Generator создаёт настраиваемый защитный барьер по границе уровня, умеет фильтровать разные типы угроз и требует серьёзного энергоснабжения для стабильной работы."
  - rscadd: "Power Transmission Laser теперь позволяет продавать избыточную энергию за кредиты, передавать её на удалённые приёмные терминалы и использовать луч против мегафауны на Лаваленде."
  - qol: "Bluespace Harvester, Bluespace Shield Field Generator и Power Transmission Laser получили полноценные интерфейсы управления с актуальной статистикой, настройками и предупреждениями."
  - rscadd: "Добавлена Terra Experimental laser sniper rifle с режимами standard, heat и overcharge, двуручным хватом, разогревом усиленного выстрела и пассивной подзарядкой."
  - bugfix: "Заряженный overcharge-выстрел Terra Experimental rifle теперь корректно берёт цель по текущему курсору и через scope даже во время движения."
  - rscadd: "Еретик получил крупную переработку веток знаний и заклинаний: добавлены и обновлены Duel Stance, Wave of Desperation, ритуал смены целей жертвоприношения и несколько ключевых эффектов лунной, космической и клинковой веток."
  - bugfix: "Исправлена работа множества ключевых механик еретика: living heart, жертвенные цели и ритуалы, арена, Codex, маска безумия, клинки, винтовка охотника, пассивки и несколько продвинутых заклинаний снова ведут себя корректно."
  - bugfix: "Драфты знаний еретика снова корректно подкидывают гарантированные боковые знания вплоть до поздних этапов развития."
  - rscadd: "Добавлены новые эпилоги еретика в roundend-report, зависящие от пути, успеха, вознесения и того, пережил ли он раунд."
  - rscadd: "Добавлена cosmic dust - дезориентирующая космическая пыль, которая замедляет цель, путает её и периодически трясёт экран."
  - qol: "Фляга eldritch essence теперь постепенно наполняется сама."
  - qol: "Руны трансмутации теперь точнее расходуют предметы из стопок и больше не съедают лишние материалы."
  - qol: "Набор главного инженера усилен: в шкафчике лежат профессиональный RCD, расширенный пояс, более быстрые powered-инструменты, bolter wrench и silo-linked multitool, а сам CE получил доступ к mining station."
  - rscadd: "Профессиональный RCD главного инженера получил доступ к защищённым конструкциям, усиленным стенам, плазменным окнам и более защищённым вариантам airlock'ов."
  - qol: "RCD с подключением к силосу теперь умеет использовать не только железо, но также стекло, плазму и алмазы."
  - bugfix: "Strip menu больше не открывается у обычных живых мобов в harm/combat mode, что убирает лишние боевые миссклики."
  - qol: "Gulag teleporter теперь поддерживает значительно более высокие цели по очкам заключённых."
  - balance: "Требования DNA Vault пересмотрены и лучше подстроены под реальный раунд."
  - rscadd: "Bridge Assistant при соответствующем station trait теперь получает mindshield implant."
  - admin: "У админов снова работает Ctrl+Alt+ЛКМ по человеку для быстрого открытия traitor panel."
  - qol: "Statpanel получил избранные команды с сохранением между сессиями, контекстным добавлением и ручной перестановкой порядка."
  - bugfix: "Окно Power Transmission Laser больше не режет кнопки управления, а индикаторы в интерфейсе больше не показывают некорректные значения заряда."
  - bugfix: "Пассивная способность еретика снова корректно повышается до второго уровня после накопления нужного количества знания."
  - soundadd: "Добавлены новые звуки для блюспейс-щита, блюспейс-харвестера, Terra Experimental rifle и музыка void lore для еретика."
  - imageadd: "Добавлены новые спрайты и эффекты для блюспейс-щита, блюспейс-харвестера, Power Transmission Laser и Terra Experimental rifle."
